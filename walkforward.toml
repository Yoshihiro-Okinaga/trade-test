[walkforward]
train_years = 8            # 学習(選抜)期間の年数
test_years = 1             # 検証(未知)期間の年数
step_years = 1             # 前進幅。test_yearsと同じにすると未知期間が重ならない
mode = "rolling"          # "anchored"(開始固定で拡大) / "rolling"(固定長スライド)
# 選抜指標:
#   成績の高さで選ぶ  : "t_value" / "average_pct" / "total_pct"
#   ばらつきを割り引く: "lower_confidence_bound"(平均-k×標準誤差)
#   時間的な一貫性重視: "year_t_value" / "worst_year_pct"(最悪年) /
#                       "positive_year_ratio"(陽性年比率×平均) / "half_split_min"(前後半の低い方)
select_metric = "year_t_value"
select_per = "pair"        # "target": Targetごと / "pair": (Target, Ref)ごと / "global": 全戦略まとめて
select_top_k = 1           # target/pairなら各グループから上位N戦略、globalなら全候補から上位N戦略を採用
min_is_trades = 30         # 選抜に必要な学習期間の最小取引数
min_is_t = 0.0             # 学習期間のt値がこの値未満の銘柄は見送る。0で無効
# ポートフォリオ全体で同時に保有できる最大建玉数。0なら無制限。
max_open_positions = 5
