# 相関・平均回帰研究
# 2001～2015で選んだ候補を固定し、2016～2020を未知期間として検証する。
# ここでは新しいペアを探索せず、pairs に書いたペアだけを調べる。
[pair_research]
period = [2016, 2020]
hedge_fit_period = [2001, 2015]
pairs = [
    # FX・指数・商品
    ["USD_CAD", "OIL_USD"],
    ["AUD_USD", "OIL_USD"],
    ["NZD_USD", "OIL_USD"],
    ["COPPER_USD", "OIL_USD"],
    ["US30_Futures", "USSPX500_Futures"],  # 高相関の対照群

