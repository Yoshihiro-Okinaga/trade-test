    ["9502_中部電力", "9509_北海道電力"],
    ["9504_中国電力", "9506_東北電力"],
    ["9502_中部電力", "9508_九州電力"],
    ["9504_中国電力", "9508_九州電力"],
    ["9502_中部電力", "9503_関西電力"],
    ["9503_関西電力", "9508_九州電力"],  # 比較対象
