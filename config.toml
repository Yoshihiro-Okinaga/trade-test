# 使う銘柄。ref（シグナル源）と target（売買対象）の両方に使う。
# symbol_groups でまとめて選ぶ（"fx" / "index" / "commodity" / "stock"）。
# symbol_names で個別に追加もできる（両方書けば合算される）。
# 銘柄の定義はすべて下の [symbols] にあり、グループもそこで宣言する。
