no_overlap = true             # 重複補正あり

# 超過リターン評価。true にすると、各トレードの損益から
# 「その銘柄を単に保有していた場合の平均的な変動」を差し引く。
# long の追い風と short の逆風が除去され、市場の方向バイアスを
# 除いた純粋な優位性を測れる。false なら従来通りの実損益。
# リストで書くと両方を1回の実行で比較できる。
use_excess_return = [
    #true, 
    false,
]

# 期間別の成績を出すための区切り年。
# [2001, 2006, ...] と書くと 2001-2005, 2006-2010, ... に分けて
# average_pct_2001_2005 のような列を出力する（trade_count も併記）。
# 空リスト [] なら期間別の集計をしない。
period_years = [2001, 2006, 2011, 2016, 2021]

# 期間の設定
ranking_period = [2001, 2015]

# エクストラコスト
#extra_cost_pct = 0.1

# 売買フィルタ。指定した指標の値が filter_max 以下の日だけエントリーする。
# adx は「トレンドの強さ」で方向を持たないため単独売買には使えないが、
# 「トレンドが弱い（レンジ）ときだけ逆張りする」という絞り込みに使える。
# 空文字 "" にするとフィルタなし（従来と同じ挙動）。
filter_signal_type = "" #"adx"
filter_max = 25.0
trade_code_type = "all"      # "same", "not_same", "all"
min_trade_count = 150
use_process_pool = true

# true にすると、各タスクの実行時間（秒）を task_elapsed_seconds 列として
# CSVに出力する。実行ごとに値が変わるため、Golden作成時はfalseにする。
output_task_time = false

# 売買判定の閾値（幅）。|signal| がこの値を超えたら売買する。
# 指標ごとに値のスケールが違うので、指標ごとに設定する。
# ここに書かない指標は default_threshold_width が使われる。
default_threshold_width = 1.0

# 数値を書けば1通り、リストを書けばその全通りを別タスクとして試す。
# 例: bb = [1.0, 1.5, 2.0, 2.5, 3.0] で5通りの閾値を一度に比較できる。
# 指標ごとに値のスケールが違うので、リストも指標ごとに指定する。
[threshold_width]
bb = [1.0, 1.5, 2.0, 2.5, 3.0]
rsi = 20.0
stoch = 30.0
di = 20.0
# macd はヒストグラムのゼロ交差を +1 / -1 / 0 で表すため、
# 0.5 にしておけば「交差した日だけ」シグナルが成立する。
macd = 0.5
# streak は連続日数そのもの。2.5 なら「3日以上の連続」で成立する。
streak = 2.5

# 指標の中心値。rsi/stoch は 0〜100 の範囲で中心 50。
# rsi は 30/70、stoch は 20/80 で判定する。
# ここに書かない指標は中心 0 とみなす（bb, change, sma, macd, di）。
[threshold_center]
rsi = 50.0
stoch = 50.0


# 売買コスト（値幅）。銘柄ごとに、仕掛け時に1回だけ引かれる片道コスト。
# 元コードで判明している値のみ設定済み。残りは 0.0 なので、
# 実際のブローカーのスプレッドが分かり次第、各自で埋めること。
# ここが 0.0 のままだと、その銘柄はコストなしで評価される点に注意。
# 銘柄ごとの売買コストとスワップ。
# cost: 仕掛け時に1回だけ引く片道コスト（値幅）
# swap: ロング保有時の日次スワップ率（％／日）。プラスならロングで受け取り、
#       ショートは符号が反転する（売買が対称なブローカーを想定）。
#       省略すると 0（株の現物や、値が不明な指数など）。

