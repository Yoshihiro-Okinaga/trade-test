[walkforward]
train_years = 8            # 学習(選抜)期間の年数
test_years = 2             # 検証(未知)期間の年数
step_years = 2             # 前進幅。test_yearsと同じにすると未知期間が重ならない
mode = "rolling"          # "anchored"(開始固定で拡大) / "rolling"(固定長スライド)
# 選抜指標: "t_value" / "year_t_value" / "lower_confidence_bound" / "average_pct" / "total_pct"
select_metric = "t_value"
select_per = "target"      # "target"(銘柄ごと) / "global"(全体)
select_top_k = 1           # 各グループから選ぶ戦略数
