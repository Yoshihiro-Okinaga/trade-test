# Parameter Plateau IS 2001-2015
#
# 通常のScreening / Walk-forward用。
# Parameter Plateau研究は専用configを使う。

symbol_groups = [
    "fx",
    "index",
    "commodity",
]

symbol_names = []

# Refには使えるがTargetからは除外する。
exclude_names = [
    "CBOE_Volatility_Index",
]

# trueかつsymbol_pairsが非空なら名指しペアだけを使う。
# falseならsymbol_groups / symbol_namesの総当たり。
symbol_pairs_use = false
symbol_pairs = []

signal_type_list = [
    "change",
    "sma",
    "bb",
    "di",
    "stoch",
]

hold_days_list = [20]
start_days_list = [1]
sma_period_list = [10, 15, 50, 100, 200]
counter_trade = [true, false]

no_overlap = true
use_excess_return = [false]

# 通常の出力では期間別集計も残す。
period_years = []
ranking_period = [2001, 2015]

filter_signal_type = ""
filter_max = 25.0
trade_code_type = "all"
min_trade_count = 30
use_process_pool = true
output_task_time = false

default_threshold_width = 1.0

[threshold_width]
bb = [1.0, 1.5, 2.0, 2.5, 3.0]
rsi = 20.0
stoch = 30.0
di = 20.0
macd = 0.5
streak = 2.5

[threshold_center]
rsi = 50.0
stoch = 50.0

