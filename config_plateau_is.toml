test_years = 1
step_years = 1
mode = "rolling"
select_metric = "worst_year_pct"
select_per = "target"
select_top_k = 1
min_is_trades = 30
min_is_t = 2.0
max_open_positions = 5

[pair_research]
# Pair研究を再開するときに期間・pairsを明示する。
# pairs=[] なら選択銘柄の組み合わせを広く調べる。
period = [2001, 2015]
hedge_fit_period = []
pairs = []

[regime_research]
# Regime研究はbase strategyとは別仮説として扱う。
periods = [
    [2001, 2005],
    [2006, 2010],
    [2011, 2015],
    [2016, 2020],
]
volatility_window = 20
volatility_baseline_window = 252
direction_sma_window = 200
min_trades_per_regime = 5
pairs = []
